        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorModel'
        '403':
          description: The role does not allow this
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorModel'
        '422':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorModel'
      security:
        - Token: []
  /membership/plans:
    get:
      tags:
        - Membership
      summary: The membership plans and their prices
      operationId: GetMembershipPlans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlansResponse'
        '422':
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericErrorModel'
  /membership:
    get:
      tags:
        - Membership
      summary: The current user's membership, or null
      operationId: GetMembership
      responses:
        '200':
          description: OK
          content:
