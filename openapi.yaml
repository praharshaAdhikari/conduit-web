components:
  schemas:
    LoginUser:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    NewUser:
      required:
        - email
        - password
        - username
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
          format: password
    User:
      required:
        - email
        - image
        - membership
        - role
        - token
        - username
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        bio:
          type: string
          nullable: true
        image:
          type: string
        token:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        membership:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Membership'
    UpdateUser:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        username:
          type: string
        bio:
          type: string
        image:
          type: string
    Profile:
      required:
        - following
        - image
        - member
        - username
      type: object
      properties:
        username:
          type: string
        bio:
          type: string
          nullable: true
        image:
          type: string
        following:
          type: boolean
        member:
          type: boolean
    Article:
      required:
        - author
        - body
        - createdAt
        - description
        - favorited
        - favoritesCount
        - hidden
        - locked
        - membersOnly
        - slug
        - tagList
        - title
        - updatedAt
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          type: string
        body:
          type: string
        tagList:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        favorited:
          type: boolean
        favoritesCount:
          type: integer
        membersOnly:
          type: boolean
        locked:
          type: boolean
        hidden:
          type: boolean
        hiddenReason:
          type: string
          nullable: true
        author:
          $ref: '#/components/schemas/Profile'
    NewArticle:
      required:
        - body
        - description
        - title
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        body:
          type: string
        tagList:
          type: array
          items:
            type: string
        membersOnly:
          type: boolean
    UpdateArticle:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        body:
          type: string
        tagList:
          type: array
          items:
            type: string
        membersOnly:
          type: boolean
    Comment:
      required:
        - author
        - body
        - createdAt
        - id
        - updatedAt
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        body:
          type: string
        author:
          $ref: '#/components/schemas/Profile'
    NewComment:
      required:
        - body
      type: object
      properties:
        body:
          type: string
    Role:
      type: string
      enum:
        - user
        - moderator
        - admin
    AdminUser:
      required:
        - createdAt
        - email
        - role
        - suspended
        - username
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        suspended:
          type: boolean
        suspendedAt:
          type: string
          nullable: true
        suspendedReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    AdminArticle:
      required:
        - author
        - createdAt
        - hidden
        - slug
        - title
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        author:
          type: string
        createdAt:
          type: string
          format: date-time
        hidden:
          type: boolean
        hiddenAt:
          type: string
          nullable: true
        hiddenBy:
          type: string
          nullable: true
        hiddenReason:
          type: string
          nullable: true
    ModerationAction:
      required:
        - action
        - createdAt
        - id
        - moderator
        - target
        - targetType
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          enum:
            - suspend
            - unsuspend
            - hide
            - unhide
            - set_role
            - refund
        moderator:
          type: string
        targetType:
          type: string
          enum:
            - user
            - article
            - payment
        target:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ModerationRequest:
      required:
        - moderation
      type: object
      properties:
        moderation:
          required:
            - reason
          type: object
          properties:
            reason:
              type: string
    SetRoleRequest:
      required:
        - user
      type: object
      properties:
        user:
          required:
            - role
          type: object
          properties:
            role:
              $ref: '#/components/schemas/Role'
    AdminUserResponse:
      required:
        - user
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AdminUser'
    AdminUsersResponse:
      required:
        - users
        - usersCount
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        usersCount:
          type: integer
    AdminArticleResponse:
      required:
        - article
      type: object
      properties:
        article:
          $ref: '#/components/schemas/AdminArticle'
    AdminArticlesResponse:
      required:
        - articles
        - articlesCount
      type: object
      properties:
        articles:
          type: array
          items:
            $ref: '#/components/schemas/AdminArticle'
        articlesCount:
          type: integer
    ModerationActionsResponse:
      required:
        - actions
        - actionsCount
      type: object
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ModerationAction'
        actionsCount:
          type: integer
